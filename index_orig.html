<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 BLE Ring Controller</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json;utf-8,%7B%22name%22%3A%22ESP32%20BLE%20Ring%20Controller%22%2C%22short_name%22%3A%22BLE%20Ring%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%7D">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 12px 0;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
            transition: all 0.3s ease;
        }

        .dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        button {
            border: none;
            outline: none;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-connect {
            background-color: var(--accent-blue);
            color: #0f172a;
            padding: 12px 18px;
            font-size: 0.95rem;
        }

        .btn-power {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 14px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-power.active {
            background: var(--accent-green);
            color: #0f172a;
        }

        .color-presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-color {
            padding: 12px;
            font-size: 0.85rem;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .color-picker-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .color-picker-container label {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 48px;
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .terminal {
            background: #020617;
            border-radius: 10px;
            padding: 12px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.78rem;
            height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .terminal-line {
            line-height: 1.3;
            word-break: break-all;
        }

        .terminal-line.tx { color: var(--accent-blue); }
        .terminal-line.rx { color: var(--accent-green); }
        .terminal-line.err { color: var(--accent-red); }
        .terminal-line.sys { color: var(--text-sub); }

        .ios-warning {
            font-size: 0.75rem;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ESP32 Ring Light</h1>
            <p>Web Bluetooth PWA Controller</p>
        </header>

        <div id="iosNotice" class="ios-warning">
            Note for iOS users: Native Safari lacks Web Bluetooth. Please open this page in <strong>Bluefy</strong> or <strong>WebBLE</strong> browser app.
        </div>

        <!-- Connection Card -->
        <div class="card">
            <div class="status-bar">
                <div class="status-indicator">
                    <div id="statusDot" class="dot"></div>
                    <span id="statusText">Disconnected</span>
                </div>
                <button id="connectBtn" class="btn-connect">Connect</button>
            </div>
        </div>

        <!-- Power & Color Controls -->
        <div class="card">
            <button id="powerBtn" class="btn-power" disabled>
                <span>Power ON / OFF</span>
            </button>

            <div class="color-presets">
                <button class="btn-color" style="background: #ef4444;" onclick="sendColor('RED')">Red</button>
                <button class="btn-color" style="background: #22c55e;" onclick="sendColor('GREEN')">Green</button>
                <button class="btn-color" style="background: #3b82f6;" onclick="sendColor('BLUE')">Blue</button>
                <button class="btn-color" style="background: #ffffff; color: #000;" onclick="sendColor('WHITE')">White</button>
                <button class="btn-color" style="background: #eab308; color: #000;" onclick="sendColor('YELLOW')">Yellow</button>
                <button class="btn-color" style="background: #a855f7;" onclick="sendColor('PURPLE')">Purple</button>
            </div>

            <div class="color-picker-container">
                <label for="customColor">Custom RGB Palette</label>
                <input type="color" id="customColor" value="#ffffff" disabled>
            </div>
        </div>

        <!-- Real-Time Console Log -->
        <div class="card">
            <div class="color-picker-container">
                <label>BLE Traffic Monitor</label>
            </div>
            <div id="terminal" class="terminal">
                <div class="terminal-line sys">[System] Application loaded. Ready to scan.</div>
            </div>
        </div>
    </div>

    <script>
        // Nordic UART Service (NUS) Configuration
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHAR_UUID  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX_CHAR_UUID  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let bleDevice = null;
        let rxCharacteristic = null;
        let txCharacteristic = null;
        let isPowerOn = false;

        // UI Element References
        const connectBtn = document.getElementById('connectBtn');
        const powerBtn = document.getElementById('powerBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const customColorInput = document.getElementById('customColor');
        const terminal = document.getElementById('terminal');
        const iosNotice = document.getElementById('iosNotice');

        // Check iOS compatibility
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS && !navigator.bluetooth) {
            iosNotice.style.display = "block";
        }

        // Register Service Worker for PWA compliance
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));`;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }

        // Connect / Disconnect Handler
        connectBtn.addEventListener('click', async () => {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            } else {
                await requestBLEConnection();
            }
        });

        async function requestBLEConnection() {
            try {
                logToTerminal('sys', 'Requesting Bluetooth devices...');
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [
                        { namePrefix: 'ESP32' },
                        { services: [UART_SERVICE_UUID] }
                    ],
                    optionalServices: [UART_SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                logToTerminal('sys', `Connecting to ${bleDevice.name}...`);
                const server = await bleDevice.gatt.connect();

                logToTerminal('sys', 'Discovering Nordic UART Service...');
                const service = await server.getPrimaryService(UART_SERVICE_UUID);

                rxCharacteristic = await service.getCharacteristic(UART_RX_CHAR_UUID);
                txCharacteristic = await service.getCharacteristic(UART_TX_CHAR_UUID);

                // Enable RX Notifications from ESP32
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

                updateUIConnected(true);
                logToTerminal('sys', 'BLE Connected & Subscribed!');

                // Auto-subscribe to status notifications
                await sendBLECommand('SUB ring/status');

            } catch (error) {
                logToTerminal('err', `Error: ${error.message || error}`);
                updateUIConnected(false);
            }
        }

        function handleNotifications(event) {
            const decoder = new TextDecoder('utf-8');
            const message = decoder.decode(event.target.value);
            logToTerminal('rx', `<- ${message.trim()}`);
        }

        async function sendBLECommand(payload) {
            if (!rxCharacteristic) return;
            try {
                const encoder = new TextEncoder();
                await rxCharacteristic.writeValue(encoder.encode(payload + '\n'));
                logToTerminal('tx', `-> ${payload}`);
            } catch (err) {
                logToTerminal('err', `TX Error: ${err.message}`);
            }
        }

        // Power Toggle
        powerBtn.addEventListener('click', async () => {
            isPowerOn = !isPowerOn;
            const cmd = isPowerOn ? 'PUB ring/power ON' : 'PUB ring/power OFF';
            await sendBLECommand(cmd);
            
            if (isPowerOn) {
                powerBtn.classList.add('active');
            } else {
                powerBtn.classList.remove('active');
            }
        });

        // Color Control Helpers
        async function sendColor(colorName) {
            if (!isPowerOn) {
                // Auto turn ON when sending color
                isPowerOn = true;
                powerBtn.classList.add('active');
                await sendBLECommand('PUB ring/power ON');
            }
            await sendBLECommand(`PUB ring/color ${colorName}`);
        }

        // Custom Hex-to-RGB Picker Handler
        customColorInput.addEventListener('change', async (e) => {
            const hex = e.target.value;
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            
            await sendColor(`${r},${g},${b}`);
        });

        function updateUIConnected(isConnected) {
            if (isConnected) {
                statusDot.classList.add('connected');
                statusText.textContent = bleDevice.name || 'Connected';
                connectBtn.textContent = 'Disconnect';
                powerBtn.disabled = false;
                customColorInput.disabled = false;
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                connectBtn.textContent = 'Connect';
                powerBtn.disabled = true;
                customColorInput.disabled = true;
                powerBtn.classList.remove('active');
                isPowerOn = false;
            }
        }

        function onDisconnected() {
            logToTerminal('sys', 'Device disconnected.');
            updateUIConnected(false);
            rxCharacteristic = null;
            txCharacteristic = null;
        }

        function logToTerminal(type, text) {
            const line = document.createElement('div');
            line.className = `terminal-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${text}`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
